{% extends 'calificaciones/base.html' %}
{% block title %}Registrar Usuario{% endblock %}

{% block content %}
<div style="display:flex; align-items:center; justify-content:center; padding: 40px 0;">
  <div class="form-box">
    <h1>NUEVO<br><span>USUARIO</span></h1>

    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="form-group">
          <label>{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <div class="field-error">{{ field.errors }}</div>
          {% endif %}
        </div>
      {% endfor %}

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Registrar</button>
        <a href="{% url 'listar_calificaciones' %}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
